<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body>
    <main>
      <div class="wrapper">
        <img
          src="images/image-product-desktop.jpg"
          alt="bottle of perfume"
          class="image image1"
          width="600"
          height="900"
        />
        <img
          src="images/image-product-mobile.jpg"
          alt="bottle of perfume"
          class="image image2"
          width="686"
          height="480"
        />

        <div class="text">
          <p class="category textpreset4">Perfume</p>
          <h1 class="textpreset1">Gabrielle Essence Eau De Parfum</h1>

          <p class="description textpreset3">
            A floral, solar and voluptuous interpretation composed by Olivier
            Polge, Perfumer-Creator for the House of CHANEL.
          </p>
          <div class="prices">
            <p class="price textpreset1">$149.99</p>
            <p class="oldprice textpreset5">$169.99</p>
          </div>
          <div class="cardbutton">
            <a class="btn textpreset2" href="#"
              ><img class="shopicon" src="images/icon-cart.svg" alt="" />Add to
              Cart</a
            >
          </div>
        </div>
      </div>
    </main>
    <footer>
      <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by <a href="#">Erwin</a>.
      </div>
    </footer>
  </body>
</html>
